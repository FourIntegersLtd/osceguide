services:
  postgres:
    # pgvector's own image: stock Postgres 16 plus the `vector`
    # extension the tutor's material index needs. Same server, same data
    # directory, so an existing volume carries over.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osce_platform
    ports:
      - "5433:5432"
    volumes:
      - platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  platform_pg:
