# Railway: create two services from this directory.
#   platform-api        uses the Dockerfile CMD (migrate, then uvicorn)
#   platform-worker     same image; set Start Command to `python -m app.worker.main`
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
