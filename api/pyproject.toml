[project]
name = "osce-guide-platform-api"
version = "0.1.0"
description = "OSCE Guide unified backend: one API serving consumer, institution and partner products"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Four Integers Ltd", email = "hello@fourintegers.com" }]

dependencies = [
    "fastapi (>=0.115,<0.136)",
    "uvicorn[standard] (>=0.30,<0.43)",
    "pydantic (>=2.10,<3)",
    "pydantic-settings (>=2.6,<3)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    "psycopg[binary,pool] (>=3.2,<4)",
    "alembic (>=1.14,<2)",
    "procrastinate (>=3.0,<4)",
    "pyjwt (>=2.9,<3)",
    "argon2-cffi (>=23.1,<26)",
    "structlog (>=24.4,<26)",
    "redis (>=5.2,<6)",
    "httpx (>=0.28,<0.29)",
    "email-validator (>=2.2,<3)",
    # Token minting, room service and agent dispatch. Only `livekit-api` (and
    # the `livekit-protocol` it pulls in) — not the realtime `livekit` SDK,
    # which is the agent worker's business and lives in assessment-platform.
    # `voice/adapter.py` imports it inside each call, so a machine without it
    # still starts and still serves every route that is not voice; it was that
    # tolerance that let the SDK go missing from here unnoticed.
    "livekit-api (>=1.2,<2)",
    # `BaseHTTPMiddleware` in `core/logging.py`. FastAPI depends on it, but a
    # module that imports it directly declares it directly.
    "starlette (>=0.40,<1)",
    # The marking models. The engine deliberately injects no LLM client of its
    # own ("LLM clients and LiveKit are injected by the consumer"), so the
    # consumer is this package. Same versions as b2c and b2b, which mark with
    # the same two, so a result is reproducible across the three.
    "openai (>=2.15,<3)",
    "anthropic (>=0.40,<1)",
    # Transactional email. `notifications/sender.py` is the only caller.
    "resend (>=2.4,<3)",
    # The assessment engine. `make engine-dev` installs it editable from the
    # sibling checkout for local work; a deployment wants the tag, which is
    # this (E-1, closed). 0.7.0 is the version that stopped shipping
    # frameworks — a rubric is authored and travels with the attempt, so an
    # older engine cannot mark anything this backend produces — and the one
    # that added the dashboard tutor's prompt.
    "osce-assessment @ git+https://github.com/FourIntegersLtd/OSCEGuide-assessment-platform.git@engine-v0.7.0#subdirectory=packages/osce_assessment",
    "python-multipart (>=0.0.18,<0.0.21)",
    # Reading the text out of an uploaded CV. `cv/service.py` imports it inside
    # the call, so a machine without it still starts and still serves every
    # route that is not a CV upload. Same pin as the retiring consumer backend.
    "pypdf (>=6.5,<7)",
    "sentry-sdk[fastapi] (>=2.19,<3)",
    "boto3 (>=1.36,<2)",
    "cartesia (>=1.4,<2)",
    "moviepy (>=2.2,<3)",
    "pydub (>=0.25,<1)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.25,<1"
testcontainers = { version = ">=4.8,<5", extras = ["postgres"] }
ruff = ">=0.8,<1"
mypy = ">=1.13,<2"
import-linter = ">=2.1,<3"
google-cloud-firestore = ">=2.19,<3"

# ---------------------------------------------------------------------------
# Tests: every async fixture and test shares one session-scoped event loop so
# the async SQLAlchemy engine is created once and never crosses loops.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "db: needs a Postgres database (testcontainers or TEST_DATABASE_URL)",
    "contract: worker-facing routes validated against the engine contracts",
    "e2e: runs the real LiveKit worker against this API (skipped unless LIVEKIT_E2E_* env is set)",
]

[tool.ruff]
# Autogenerated migrations carry long inline constraint SQL; reflowing it by
# hand each time would be a standing invitation to introduce a typo.
extend-exclude = ["alembic/versions"]
line-length = 110
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM"]
ignore = ["S101", "N818"]  # assert is fine in tests; error classes are named for how they read at the raise site

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # literal test secrets
# Verbatim B2C prompt literals. Wrapping them would change the model input
# and inflate the file past the 250-line cap the guards enforce.
"app/features/generation/exam_prompts.py" = ["E501"]
# The error classes are named for the HTTP conditions they carry, which is how
# they read at the raise site and in the handler that maps them to a status.
# An `Error` suffix on each buys nothing there; they all subclass `AppError`.
"app/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["supabase/"]
ignore_missing_imports = true

# The MoviePy slide renderer is a verbatim port of a 2,200-line untyped module.
# Typing it is a separate piece of work; until then mypy must not block CI.
[[tool.mypy.overrides]]
module = [
    "app.features.media_production.slide_renderer",
    "app.features.media_production.slide_models",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.migration.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Architecture rules, checked in CI. `core` is the shared kernel and may never
# know about a feature. Slices are layered: a slice may import from layers
# listed below it, never above. Add each new slice to the layers list.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core never imports features"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
name = "feature slices depend downward only"
type = "layers"
layers = [
    # Highest first. A slice may call anything below it, never above.
    #
    # The consumer-facing slices sit above `catalog` rather than below it: they
    # all need to know which exam something belongs to, and a marketplace post
    # or a podcast is a higher-level idea than the exam catalogue, not a lower
    # one. They were under `identity` here, which made every one of those calls
    # a contract violation and left `make arch` failing.
    "app.features.dashboard",
    "app.features.tutor_memory",
    "app.features.billing",
    "app.features.station_sets",
    "app.features.results",
    "app.features.reviews",
    "app.features.sittings",
    "app.features.roster",
    "app.features.assistant",
    "app.features.marketplace",
    "app.features.community",
    "app.features.cv",
    "app.features.peer_practice",
    "app.features.growth",
    "app.features.media",
    "app.features.voice",
    "app.features.attempts",
    "app.features.stations",
    "app.features.entitlements",
    "app.features.catalog",
    "app.features.rubrics",
    "app.features.tenancy",
    "app.features.identity",
    # Lowest: everything writes to the outbox and it calls nothing back.
    "app.features.notifications",
    "app.features.health",
]
# Slot attempts freeze the sitting's bound rubric. sittings sits above attempts
# in this list, so the one lookup is an explicit exception rather than a layer
# inversion of the whole slice.
ignore_imports = [
    "app.features.attempts.service_render -> app.features.sittings.service",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
