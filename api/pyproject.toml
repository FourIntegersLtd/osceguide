[project]
name = "osce-guide-platform-api"
version = "0.1.0"
description = "OSCE Guide unified backend: one API serving consumer, institution and partner products"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Four Integers Ltd", email = "hello@fourintegers.com" }]

dependencies = [
    "fastapi (>=0.115,<0.136)",
    "uvicorn[standard] (>=0.30,<0.43)",
    "pydantic (>=2.10,<3)",
    "pydantic-settings (>=2.6,<3)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    "psycopg[binary,pool] (>=3.2,<4)",
    "alembic (>=1.14,<2)",
    "procrastinate (>=3.0,<4)",
    "pyjwt (>=2.9,<3)",
    "argon2-cffi (>=23.1,<26)",
    "structlog (>=24.4,<26)",
    "redis (>=5.2,<6)",
    "httpx (>=0.28,<0.29)",
    "email-validator (>=2.2,<3)",
    # Token minting, room service and agent dispatch. Only `livekit-api` (and
    # the `livekit-protocol` it pulls in) — not the realtime `livekit` SDK,
    # which is the agent worker's business and lives in assessment-platform.
    # `voice/adapter.py` imports it inside each call, so a machine without it
    # still starts and still serves every route that is not voice; it was that
    # tolerance that let the SDK go missing from here unnoticed.
    "livekit-api (>=1.2,<2)",
    # `BaseHTTPMiddleware` in `core/logging.py`. FastAPI depends on it, but a
    # module that imports it directly declares it directly.
    "starlette (>=0.40,<1)",
    # The marking models. The engine deliberately injects no LLM client of its
    # own ("LLM clients and LiveKit are injected by the consumer"), so the
    # consumer is this package. Same versions as b2c and b2b, which mark with
    # the same two, so a result is reproducible across the three.
    "openai (>=2.15,<3)",
    "anthropic (>=0.40,<1)",
    # Transactional email. `notifications/sender.py` is the only caller.
    "resend (>=2.4,<3)",
    # The assessment engine, from this repository's own `assessment/` folder
    # (see `[tool.poetry.dependencies]` below for where). An api change can use
    # an engine change in the same commit, with no tag and no reinstall.
    "osce-assessment",
    "python-multipart (>=0.0.18,<0.0.21)",
    # Reading the text out of an uploaded CV. `cv/service.py` imports it inside
    # the call, so a machine without it still starts and still serves every
    # route that is not a CV upload. Same pin as the retiring consumer backend.
    "pypdf (>=6.5,<7)",
    # Result PDFs. Pure Python, so a Railway deploy does not need a system
    # PDF library. The Unicode face is the bundled DejaVu file, not a font
    # the host is assumed to have.
    "fpdf2 (>=2.8,<3)",
    "sentry-sdk[fastapi] (>=2.19,<3)",
    "boto3 (>=1.36,<2)",
    "cartesia (>=1.4,<2)",
    "moviepy (>=2.2,<3)",
    "pydub (>=0.25,<1)",
    "cryptography (>=50.0.1,<51.0.0)",
    # TOTP for authenticator-app sign-in. Recovery codes are argon2, not this.
    "pyotp (>=2.9,<3)",
    "python3-saml (>=1.16.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

# Where `osce-assessment` comes from. `develop = false` copies it into the
# environment, as the Docker build needs; after an engine change run
# `poetry install` again (or `make ci`, which does) to pick it up.
[tool.poetry.dependencies]
osce-assessment = { path = "../assessment/packages/osce_assessment", develop = false }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.25,<1"
pytest-xdist = ">=3.6,<4"
testcontainers = { version = ">=4.8,<5", extras = ["postgres"] }
ruff = ">=0.8,<1"
mypy = ">=1.13,<2"
import-linter = ">=2.1,<3"
google-cloud-firestore = ">=2.19,<3"

# ---------------------------------------------------------------------------
# Tests: every async fixture and test shares one session-scoped event loop so
# the async SQLAlchemy engine is created once and never crosses loops.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "db: needs a Postgres database (testcontainers or TEST_DATABASE_URL)",
    "contract: worker-facing routes validated against the engine contracts",
    "e2e: runs the real LiveKit worker against this API (skipped unless LIVEKIT_E2E_* env is set)",
]

[tool.ruff]
# Autogenerated migrations carry long inline constraint SQL; reflowing it by
# hand each time would be a standing invitation to introduce a typo.
extend-exclude = ["alembic/versions"]
line-length = 110
target-version = "py311"
src = ["."]

[tool.ruff.lint]
# BLE (no bare `except Exception`) is on so that every broad catch carries a
# `noqa: BLE001 - why` beside it: the reason is the documentation.
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM", "BLE"]
ignore = ["S101", "N818"]  # assert is fine in tests; error classes are named for how they read at the raise site

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # literal test secrets
# Verbatim B2C prompt literals. Wrapping them would change the model input
# and inflate the file past the 250-line cap the guards enforce.
"app/features/generation/exam_prompts.py" = ["E501"]
# Same reason: the diarisation prompt is ported verbatim from b2c, and where a
# turn is cut decides what the rubric is marked against (P-1).
"app/features/peer_practice/transcript_prompt.py" = ["E501"]
# Same reason again: the assistant's FAQ entries and prompt templates are b2c's
# wording, ported unchanged. Rewrapping an answer changes what is said aloud
# (A-2), and these files are data, not logic.
"app/features/assistant/content/packs/*.py" = ["E501"]
"app/features/assistant/content/prompts/*.py" = ["E501"]
# The error classes are named for the HTTP conditions they carry, which is how
# they read at the raise site and in the handler that maps them to a status.
# An `Error` suffix on each buys nothing there; they all subclass `AppError`.
"app/core/errors.py" = ["N818"]
# The slide renderer is a verbatim port (see the mypy override below); its
# broad catches are kept as they were rather than re-reasoned line by line.
"app/features/media_production/slide_renderer.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["supabase/"]
ignore_missing_imports = true

# The MoviePy slide renderer is a verbatim port of a 2,200-line untyped module.
# Typing it is a separate piece of work; until then mypy must not block CI.
[[tool.mypy.overrides]]
module = [
    "app.features.media_production.slide_renderer",
    "app.features.media_production.slide_models",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.migration.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Architecture rules, checked in CI. `core` is the shared kernel and may never
# know about a feature. Slices have no order: any slice may call another's
# service (ADR 0002, amended 2026-09-25).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core never imports features"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.features"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
