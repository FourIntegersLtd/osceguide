[project]
name = "osce-guide-platform-api"
version = "0.1.0"
description = "OSCE Guide unified backend: one API serving consumer, institution and partner products"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Four Integers Ltd", email = "hello@fourintegers.com" }]

dependencies = [
    "fastapi (>=0.115,<0.136)",
    "uvicorn[standard] (>=0.30,<0.43)",
    "pydantic (>=2.10,<3)",
    "pydantic-settings (>=2.6,<3)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    "psycopg[binary,pool] (>=3.2,<4)",
    "alembic (>=1.14,<2)",
    "procrastinate (>=3.0,<4)",
    "pyjwt (>=2.9,<3)",
    "argon2-cffi (>=23.1,<26)",
    "structlog (>=24.4,<26)",
    "redis (>=5.2,<6)",
    "httpx (>=0.28,<0.29)",
    "email-validator (>=2.2,<3)",
    "python-multipart (>=0.0.18,<0.0.21)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.25,<1"
testcontainers = { version = ">=4.8,<5", extras = ["postgres"] }
ruff = ">=0.8,<1"
mypy = ">=1.13,<2"
import-linter = ">=2.1,<3"

# ---------------------------------------------------------------------------
# Tests: every async fixture and test shares one session-scoped event loop so
# the async SQLAlchemy engine is created once and never crosses loops.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "db: needs a Postgres database (testcontainers or TEST_DATABASE_URL)",
    "contract: worker-facing routes validated against the engine contracts",
    "e2e: runs the real LiveKit worker against this API (skipped unless LIVEKIT_E2E_* env is set)",
]

[tool.ruff]
# Autogenerated migrations carry long inline constraint SQL; reflowing it by
# hand each time would be a standing invitation to introduce a typo.
extend-exclude = ["alembic/versions"]
line-length = 110
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM"]
ignore = ["S101", "N818"]  # assert is fine in tests; error classes are named for how they read at the raise site

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # literal test secrets

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["supabase/"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Architecture rules, checked in CI. `core` is the shared kernel and may never
# know about a feature. Slices are layered: a slice may import from layers
# listed below it, never above. Add each new slice to the layers list.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core never imports features"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
name = "feature slices depend downward only"
type = "layers"
layers = [
    # Highest first. A slice may call anything below it, never above.
    "app.features.dashboard",
    "app.features.billing",
    "app.features.station_sets",
    "app.features.sittings",
    "app.features.roster",
    "app.features.voice",
    "app.features.attempts",
    "app.features.stations",
    "app.features.entitlements",
    "app.features.catalog",
    "app.features.tenancy",
    "app.features.identity",
    "app.features.health",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
