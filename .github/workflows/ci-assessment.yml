name: CI assessment

# The assessment engine and the LiveKit workers, on every change under
# assessment/. A green run on main is what publish-workers.yml waits for.

# The worker deploy tooling is included because "Promote workers to production"
# refuses any commit without a green run of this workflow: a change to those
# files must still produce one, or it could never be promoted.
on:
  pull_request:
    paths:
      - "assessment/**"
      - ".github/workflows/ci-assessment.yml"
      - ".github/workflows/publish-workers.yml"
      - ".github/workflows/promote-workers.yml"
      - ".github/actions/roll-out-workers/**"
      - ".github/actions/connect-to-control-plane/**"
  push:
    branches: [main]
    paths:
      - "assessment/**"
      - ".github/workflows/ci-assessment.yml"
      - ".github/workflows/publish-workers.yml"
      - ".github/workflows/promote-workers.yml"
      - ".github/actions/roll-out-workers/**"
      - ".github/actions/connect-to-control-plane/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: assessment-platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assessment
    env:
      SENTRY_DSN: ""
      OPENAI_API_KEY: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy
      DEEPGRAM_API_KEY: ci-dummy
      CARTESIA_API_KEY: ci-dummy
      ELEVEN_API_KEY: ci-dummy
      GOOGLE_API_KEY: ci-dummy
      LIVEKIT_URL: wss://ci.example.livekit.cloud
      LIVEKIT_API_KEY: ci-dummy
      LIVEKIT_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - uses: actions/cache@v4
        id: venv
        with:
          path: assessment/.venv
          key: venv-${{ runner.os }}-py3.11-assessment-${{ hashFiles('assessment/poetry.lock') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      # Includes the drift test against web/'s guidance contracts, which is in
      # the same checkout.
      - name: Tests (leakage guards, contracts, worker)
        run: poetry run pytest -q
      - name: Engine subtree is exportable
        working-directory: .
        run: git subtree split --prefix=assessment/packages/osce_assessment >/dev/null
      - name: Worker import smoke (no product, prompt or scoring code loaded)
        run: poetry run pytest -q tests/test_assessment_worker_boundaries.py
