name: Publish workers

# Builds the single worker image from assessment/ (OSCE_LIVEKIT_WORKER selects assessment or
# assistant at run time) after CI assessment passes on main, tags it with its commit sha,
# and rolls it out to STAGING on the K3s control plane.
#
# This workflow never touches production. Production only changes when someone
# runs "Promote workers to production" (promote-workers.yml), which ships an image
# this workflow built and staging already ran.
#
# Repository variable K8S_AUTO_DEPLOY=true turns the staging rollout on; with any
# other value the image is built and tagged but not deployed anywhere.

on:
  workflow_run:
    workflows:
      - CI assessment
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-workers-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/fourintegersltd/osceguide-assessment-platform

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Resolve publish commit SHA
        id: publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.publish.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: assessment
          file: assessment/Dockerfile
          push: true
          # Only the commit sha. The moving `:staging` and `:production` tags are set
          # by the roll-out-workers action after a rollout succeeds, so each always
          # names what that environment is actually running.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.publish.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    # Draining pods can hold a rollout for many minutes; see rollout-timeout-seconds.
    timeout-minutes: 45
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      vars.K8S_AUTO_DEPLOY == 'true'
    # GitHub Environment "staging-workers": shows the deploy history under the repo's
    # Environments tab and can hold staging-only secrets later.
    environment: staging-workers
    # One staging rollout at a time; a newer push waits rather than cancelling a
    # rollout halfway through draining.
    concurrency:
      group: deploy-workers-staging
      cancel-in-progress: false
    steps:
      # Deploy the manifests from the same commit the image was built from.
      - name: Checkout published commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - name: Connect to the control plane
        uses: ./.github/actions/connect-to-control-plane
        with:
          control-plane-host: ${{ secrets.K8S_CONTROL_PLANE_HOST }}
          control-plane-ssh-key: ${{ secrets.K8S_CONTROL_PLANE_SSH_KEY }}

      - name: Roll out to staging
        uses: ./.github/actions/roll-out-workers
        with:
          environment: staging-workers
          image-digest: ${{ needs.publish.outputs.digest }}
          commit-sha: ${{ needs.publish.outputs.sha }}
          control-plane-host: ${{ secrets.K8S_CONTROL_PLANE_HOST }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          manifest-root: ${{ vars.K8S_MANIFEST_DIR || '/root/k8s/assessment-platform' }}
          rollout-timeout-seconds: ${{ vars.ROLLOUT_TIMEOUT_SECS || '1800' }}
