# One Railway service per worker, same repo root. Each service sets
# OSCE_LIVEKIT_WORKER=assessment (later: assistant) and VOICE_BACKENDS_JSON.

[build]
builder = "DOCKERFILE"

[deploy]
# One gunicorn worker + one agent subprocess per container; one replica per service.
startCommand = "sh -c 'exec make start'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1

[env]
PYTHON_VERSION = "3.11.12"
