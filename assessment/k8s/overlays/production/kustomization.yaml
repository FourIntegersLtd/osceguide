# Production: the workers real candidates talk to.
#
# Deployed only by the "Promote workers to production" workflow
# (.github/workflows/promote-workers.yml), and only with an image that has
# already run on staging. Never by a push to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The namespace the live workers have always run in. Do not rename it: a rename
# would start a second set of workers beside the running ones instead of
# replacing them. tests/test_k8s_config.py holds this name in place.
namespace: assessment-platform

# Which build these workers run. The committed value is the moving `production`
# tag, so a hand-run `kubectl apply -k` gets whatever production last ran. The
# deploy workflow rewrites this line to the exact image digest it is rolling out,
# so a deploy can never pick up a different build than the one it checked.
images:
  - name: ghcr.io/fourintegersltd/osceguide-assessment-platform
    newTag: production

# The commit these workers were built from, stamped by the deploy workflow in
# place of "unpinned". `kubectl get deploy -n assessment-platform -o yaml` then
# answers "what is production running?" without comparing digests by hand.
commonAnnotations:
  osceguide.io/commit: unpinned

# Production's per-pod capacity is the base's (6 + 3 sessions). Its replica count is
# deliberately not set here: scripts/k8s_rollout_on_control_plane.sh appends a
# `replicas:` block to the deploy's copy equal to the number of nodes labelled
# osceguide.io/livekit-worker=true (a committed value would be reset on each promote).
# This file renders the base's 1. The only other thing it adds is its Sentry label.
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: assessment-worker-config
      data:
        SENTRY_ENVIRONMENT: "production"
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: assistant-worker-config
      data:
        SENTRY_ENVIRONMENT: "production"
