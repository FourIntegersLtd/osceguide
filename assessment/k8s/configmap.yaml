apiVersion: v1
kind: ConfigMap
metadata:
  name: assessment-worker-config
  namespace: assessment-platform
data:
  OSCE_LIVEKIT_HOSTING: "self-hosted"
  OSCE_LIVEKIT_WORKER: "assessment"
  LIVEKIT_ASSESSMENT_AGENT_NAME: "assessment-self-hosted"
  LIVEKIT_ASSESSMENT_WORKER_PORT: "8087"
  # Per-node admission limit: with one pod per node (topologySpreadConstraints in
  # deployment.yaml) this is how many consultations a single CX33 will accept. The
  # node measured ~8 comfortable concurrent sessions in total and also carries an
  # assistant pod, so the budget is split 6/3 between the two. Re-measure and
  # re-tune; see livekit/k8s/INFRASTRUCTURE.md.
  LIVEKIT_ASSESSMENT_MAX_CONCURRENT_JOBS: "6"
  # Stay under terminationGracePeriodSeconds (900s) so the worker finishes draining
  # before the kubelet's SIGKILL. The SDK default is one hour, which would outlast it.
  LIVEKIT_ASSESSMENT_DRAIN_TIMEOUT: "840"
  # Backends the worker may be dispatched for, keyed by the opaque label the
  # dispatching backend puts in job metadata. URLs and secrets come from env
  # variables named here (see secret.example.yaml). The secret header and
  # every route path are what that backend actually serves; the attempt
  # routes default to /api/worker/attempts/{attempt_id}[...] when omitted.
  VOICE_BACKENDS_JSON: |
    {
      "practice": {
        "base_url_env": "PRACTICE_API_URL",
        "secret_env": "PRACTICE_WORKER_SECRET",
        "secret_header": "X-B2C-Worker-Secret",
        "slot_release_path": "/api/worker/livekit-cloud-slot/release",
        "slot_extend_path": "/api/worker/livekit-cloud-slot/extend",
        "slot_payload_key": "room_name"
      },
      "institution": {
        "base_url_env": "INSTITUTION_API_URL",
        "secret_env": "INSTITUTION_WORKER_SECRET",
        "secret_header": "X-B2B-Worker-Secret",
        "slot_release_path": "/api/b2b/worker/livekit-cloud-slot/release",
        "slot_extend_path": "/api/b2b/worker/livekit-cloud-slot/extend",
        "slot_payload_key": "roomName",
        "attempt_path": "/api/b2b/worker/attempts/{attempt_id}",
        "transcript_chunks_path": "/api/b2b/worker/attempts/{attempt_id}/transcript-chunks",
        "transcript_path": "/api/b2b/worker/attempts/{attempt_id}/transcript"
      }
    }
  SENTRY_ENVIRONMENT: "production"
