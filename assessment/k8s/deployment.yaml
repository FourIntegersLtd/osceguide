apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-worker
  namespace: assessment-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-worker
  template:
    metadata:
      labels:
        app: assessment-worker
    spec:
      # Same node rule as the legacy worker: only labelled worker nodes, never the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: osceguide.io/livekit-worker
                    operator: In
                    values:
                      - "true"
      # Private GHCR image (published by .github/workflows/publish-ghcr.yml).
      imagePullSecrets:
        - name: ghcr-pull-credentials
      containers:
        - name: worker
          image: ghcr.io/fourintegersltd/osceguide-assessment-platform:production
          envFrom:
            - configMapRef:
                name: assessment-worker-config
            - secretRef:
                name: assessment-worker-secrets
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
