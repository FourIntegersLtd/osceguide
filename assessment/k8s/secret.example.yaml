# Template for the workers' secrets. One copy per environment, created by hand on the
# control plane and never committed (secret.yaml is git-ignored):
#
#   cp secret.example.yaml secret.yaml          # fill in this environment's values
#   kubectl apply -n assessment-platform-staging -f secret.yaml   # staging
#   kubectl apply -n assessment-platform -f secret.yaml           # production
#
# There is no namespace below on purpose: `-n` picks the environment, so the same
# template serves both. Staging values come from staging accounts only (the
# new-test-agent LiveKit project, staging-api, a staging-only worker secret);
# see README.md, "Setting up an environment".
apiVersion: v1
kind: Secret
metadata:
  name: assessment-worker-secrets
type: Opaque
stringData:
  LIVEKIT_URL: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  PRACTICE_API_URL: ""
  PRACTICE_WORKER_SECRET: ""
  INSTITUTION_API_URL: ""
  INSTITUTION_WORKER_SECRET: ""
  # The unified backend. Its WORKER_SECRET must be the same value, and it
  # refuses to start in staging or production without one.
  PLATFORM_API_URL: ""
  PLATFORM_WORKER_SECRET: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  CARTESIA_API_KEY: ""
  ELEVEN_API_KEY: ""
  GOOGLE_API_KEY: ""
  SENTRY_DSN: ""
