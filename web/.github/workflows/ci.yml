name: CI

# Types, lint and unit tests on every pull request and every push to main.
#
# "Promote to production" refuses a commit unless this workflow passed on it, so
# a red main can reach staging (Vercel builds every push) but never production.
#
# `npm run ci` locally also runs `check:ledger`, which reads platform-api's
# openapi.json from the sibling backend checkout. That checkout does not exist
# here, so this workflow runs the other three steps of `npm run ci` by name.

on:
  pull_request:
  push:
    branches: [main]

# Reading the code is all this workflow does.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22 matches local development and the Vercel project's setting.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run types

      # Includes the tier rules (eslint-plugin-boundaries).
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
